# 日語一步通 v2.3 高清語音版 — GitHub Actions 自動建置 APK
# 放置位置：.github/workflows/build-apk.yml（與 settings.gradle.kts 同層）
name: Build Japanese Step by Step v2.3 APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # 手動觸發

# 最小必要權限：僅需讀取 repo 內容與上傳 artifact
permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 接受 Android SDK 授權、設定 ANDROID_HOME（ubuntu 執行器已內建 SDK）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 若無 local.properties，由 ANDROID_HOME 產生，供 AGP 定位 SDK
      - name: Ensure local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          cat local.properties

      # Gradle 快取，加速重複建置
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 實際建置：Debug（自動簽署）+ Release（以 debug key 簽署，可直接安裝）
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # 上傳建置產物（可於 Actions 結果頁下載）
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseStepByStep-v2.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseStepByStep-v2.3-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 產出摘要（成功/失敗一目了然）
  summary:
    name: Build Summary
    needs: build-apk
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print result
        run: |
          echo "::notice::Build job completed. Download APKs from the 'Artifacts' section of this run."
#(註：內容由 AI 生成)
